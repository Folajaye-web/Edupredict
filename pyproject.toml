[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edupredict-nigeria"
version = "2.0.0"
description = "AI-powered Nigerian school academic intelligence and early-warning system"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40,<2", "pandas>=2.1,<3", "numpy>=1.26,<3", "scikit-learn==1.9.0",
  "joblib>=1.3,<2", "SQLAlchemy>=2.0,<3", "pydantic>=2.7,<3", "openpyxl>=3.1,<4",
  "plotly>=5.24,<7", "python-dateutil>=2.8,<3", "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath=["src"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
